[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "notegram"
version = "2.0.0"
description = "Dependency-free HTTPS logging and durable Telegram notifications"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "hiaoxui", email = "hiaoxui@gmail.com" }]
dependencies = []

[project.scripts]
notegram = "notegram.__main__:run"
notegram-server = "notegram.server.cli:run"

[tool.hatch.build.targets.wheel]
packages = ["src/notegram"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
